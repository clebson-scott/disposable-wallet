# Base44 dev environment for "The Disposable Wallet" — a reproducible Python study.
# Runs the full analysis pipeline (make all) to regenerate JSON results, the
# figure and the PDF, then serves a results dashboard on host port 3000.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.base44
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "3000:3000"
    # Regenerate every artifact from the local datasets, then serve the repo
    # root as a static site (index.html is the results dashboard).
    command:
      - sh
      - -ec
      - |
        make all
        exec python3 -m http.server 3000 --bind 0.0.0.0
    restart: on-failure
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/').read()"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 120s
